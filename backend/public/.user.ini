; The PHP limits the API contract needs, owned by the repo rather than by the host's defaults.
; A sync is up to 16 MB of JSON (PUT /api/data); an exercise video up to MEDIA_MAX_VIDEO_MB (90)
; raw. Stock PHP refuses both (post_max_size 8M). The cPanel host's alt-php defaults happen to be
; higher today (1024M); this file keeps the requirement true if they change or the account moves.
; Read by PHP's CGI/FastCGI/LiteSpeed SAPIs from the document root of the script, i.e. public/.
post_max_size = 100M
upload_max_filesize = 100M
memory_limit = 256M
max_execution_time = 120
max_input_time = 120
