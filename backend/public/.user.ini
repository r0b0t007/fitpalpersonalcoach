; The PHP limits the API contract needs, for PHP-FPM/CGI hosts. The cPanel host runs LiteSpeed,
; which IGNORES this file (measured in CHW-227) and reads the same values from the php_value block
; in .htaccess beside it instead. Keep the two in step.
;
; A sync is up to 16 MB of JSON (PUT /api/data): it fits in 256M and fails at 128M (measured), so
; 512M leaves room for a state shaped worse than the test's. A video is up to MEDIA_MAX_VIDEO_MB
; (90) raw, so the body limits sit above it.
post_max_size = 100M
upload_max_filesize = 100M
memory_limit = 512M
max_execution_time = 120
max_input_time = 120
