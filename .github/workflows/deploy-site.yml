# Deploys the FitPal marketing site (static, no build step) to Namecheap via rsync
# over SSH (port 21098).
# Same guardrail set as deploy-web.yml / deploy-api.yml:
#   1. The check job must pass in THIS run — HTML validity + an SEO regression grep
#      (canonical, hreflang, og:image on every page) so a refactor can't silently
#      strip the tags the whole site exists for.
#   2. Opt-in: deploy only runs while the repository variable DEPLOY_SITE is 'true'.
#   3. `production` environment — required reviewers gate every deploy on approval.
#   4. One deploy at a time, never cancelled mid-upload.
#   5. rsync --delete mirrors site/ exactly, excluding server-owned paths
#      (.htaccess, .well-known/).
#   6. Post-deploy checks fail loudly: /, /en/ and /sitemap.xml must all serve.
# The site lives on the fitpal.ma addon domain — SITE_SERVER_DIR keeps it apart from
# the app's public_html. Shared SSH_* secrets across all three deploy workflows.
# See docs/DEPLOY_NAMECHEAP.md and site/README.md.
name: Deploy Site (Namecheap)

on:
  pull_request:
    paths:
      - 'site/**'
      - '.github/workflows/deploy-site.yml'
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/deploy-site.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-site
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Validate HTML
        run: npx --yes html-validate "site/**/*.html"
      - name: SEO regression grep
        run: |
          fail=0
          for f in site/index.html site/en/index.html site/mentions-legales.html site/en/legal.html; do
            for tag in 'rel="canonical"' 'hreflang="fr"' 'hreflang="en"' 'hreflang="x-default"'; do
              grep -q "$tag" "$f" || { echo "::error file=$f::missing $tag"; fail=1; }
            done
          done
          for f in site/index.html site/en/index.html; do
            for tag in 'og:image' 'twitter:card' 'application/ld+json' '<h1'; do
              grep -q "$tag" "$f" || { echo "::error file=$f::missing $tag"; fail=1; }
            done
          done
          grep -q 'Sitemap:' site/robots.txt || { echo "::error::robots.txt missing Sitemap"; fail=1; }
          exit $fail

  deploy:
    needs: check
    # never from a PR — only main pushes and manual dispatch reach the deploy gate
    if: github.event_name != 'pull_request' && vars.DEPLOY_SITE == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7
      # rsync over SSH (Namecheap shared: port 21098). --delete keeps the fitpal.ma
      # document root an exact mirror of site/, EXCEPT server-owned files (.htaccess,
      # AutoSSL's .well-known challenges).
      - name: Set up SSH
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          if [ -n "${{ vars.SSH_KNOWN_HOSTS }}" ]; then
            printf '%s\n' "${{ vars.SSH_KNOWN_HOSTS }}" >> ~/.ssh/known_hosts
          else
            ssh-keyscan -p "${{ vars.SSH_PORT || '21098' }}" "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts
          fi

      - name: Deploy via rsync over SSH
        run: |
          rsync -rlptz --delete \
            --exclude='.htaccess' --exclude='.well-known/' \
            -e "ssh -i ~/.ssh/id_deploy -p ${{ vars.SSH_PORT || '21098' }}" \
            site/ "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ vars.SITE_SERVER_DIR || 'fitpal.ma/' }}"

      - name: Health check
        if: vars.SITE_URL != ''
        run: |
          base="${{ vars.SITE_URL }}"
          base="${base%/}"
          for path in "/" "/en/" "/sitemap.xml"; do
            ok=0
            for i in 1 2 3; do
              if curl -fsS --max-time 10 "$base$path" > /tmp/out; then ok=1; break; fi
              sleep 5
            done
            [ "$ok" = "1" ] || { echo "::error::$path did not serve"; exit 1; }
          done
          curl -fsS "$base/" | grep -q "<title>" || { echo "::error::landing page has no title"; exit 1; }
          echo "Site healthy."
