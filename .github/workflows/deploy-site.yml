# Deploys the FitPal marketing site (static, no build step) to Cloudflare Pages.
# Replaces the previous rsync-over-SSH-to-Namecheap deploy: Pages gives us a global
# CDN, free TLS, atomic deploys with instant rollback, and per-PR preview URLs.
#
# Guardrails, unchanged in spirit from the other pipelines:
#   1. The check job must pass in THIS run — HTML validity + an SEO regression grep
#      (canonical, hreflang, og:image on every page) so a refactor can't silently
#      strip the tags the whole site exists for.
#   2. Opt-in: deploy only runs while the repository variable DEPLOY_SITE is 'true'.
#   3. `production` environment — required reviewers gate every production deploy.
#   4. One deploy at a time, never cancelled mid-upload.
#   5. Pages deploys are atomic and versioned — a bad deploy is rolled back in the
#      dashboard rather than re-uploaded, so there is no partial-state window.
#   6. Post-deploy checks fail loudly: /, /en/ and /sitemap.xml must all serve.
#
# PRs get a preview deployment (own URL, not the custom domain) so a change can be
# eyeballed before merge; only main publishes to production.
# Secrets: CLOUDFLARE_API_TOKEN (Pages:Edit), CLOUDFLARE_ACCOUNT_ID.
name: Deploy Site (Cloudflare Pages)

on:
  pull_request:
    paths:
      - 'site/**'
      - '.github/workflows/deploy-site.yml'
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/deploy-site.yml'
  workflow_dispatch:

permissions:
  contents: read
  deployments: write
  pull-requests: write

concurrency:
  group: deploy-site-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Validate HTML
        run: npx --yes html-validate "site/**/*.html"
      - name: SEO regression grep
        run: |
          fail=0
          for f in site/index.html site/en/index.html site/mentions-legales.html site/en/legal.html; do
            for tag in 'rel="canonical"' 'hreflang="fr"' 'hreflang="en"' 'hreflang="x-default"'; do
              grep -q "$tag" "$f" || { echo "::error file=$f::missing $tag"; fail=1; }
            done
          done
          for f in site/index.html site/en/index.html; do
            for tag in 'og:image' 'twitter:card' 'application/ld+json' '<h1'; do
              grep -q "$tag" "$f" || { echo "::error file=$f::missing $tag"; fail=1; }
            done
          done
          grep -q 'Sitemap:' site/robots.txt || { echo "::error::robots.txt missing Sitemap"; fail=1; }
          # Cloudflare Pages serves /foo.html at /foo — canonicals/sitemap must use the
          # extensionless form or every legal-page URL resolves through a 308.
          grep -rq 'fitpal\.ma/[a-z-]*\.html' site/*.html site/en/*.html site/sitemap.xml \
            && { echo "::error::.html URLs found — Pages redirects those, use extensionless"; fail=1; }
          exit $fail

  deploy:
    needs: check
    if: vars.DEPLOY_SITE == 'true'
    runs-on: ubuntu-latest
    # PR previews deploy without the production gate; only main needs approval.
    environment: ${{ github.event_name == 'pull_request' && 'preview' || 'production' }}
    outputs:
      url: ${{ steps.pages.outputs.deployment-url }}
    steps:
      - uses: actions/checkout@v7

      - name: Deploy to Cloudflare Pages
        id: pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            pages deploy site
            --project-name=fitpal
            --branch=${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.number) || 'main' }}

      - name: Comment preview URL on the PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v9
        with:
          script: |
            const url = '${{ steps.pages.outputs.deployment-url }}';
            if (!url) return;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `📄 Site preview: ${url}`
            });

      - name: Health check
        if: github.event_name != 'pull_request' && vars.SITE_URL != ''
        run: |
          base="${{ vars.SITE_URL }}"
          base="${base%/}"
          for path in "/" "/en/" "/sitemap.xml"; do
            ok=0
            for i in 1 2 3; do
              if curl -fsS --max-time 15 "$base$path" > /tmp/out; then ok=1; break; fi
              sleep 5
            done
            [ "$ok" = "1" ] || { echo "::error::$path did not serve"; exit 1; }
          done
          curl -fsS "$base/" | grep -q "<title>" || { echo "::error::landing page has no title"; exit 1; }
          echo "Site healthy."
