# Deploys the frontend to Namecheap shared hosting (static files into public_html)
# via rsync over SSH (port 21098). Companion to deploy-api.yml — same guardrail set; see docs/DEPLOY_NAMECHEAP.md.
#
#   1. The frontend test job (locale checks + vitest) must pass in THIS run.
#   2. Opt-in: the deploy job only runs while the repository variable DEPLOY_WEB is 'true'.
#   3. `production` environment — required reviewers there gate every deploy on approval.
#   4. One deploy at a time, never cancelled mid-upload.
#   5. rsync --delete mirrors the build exactly but excludes server-owned paths
#      (.htaccess, .well-known/, cgi-bin/) so cPanel and AutoSSL keep working.
#   6. Post-deploy check fetches the site and fails loudly if it doesn't serve the app.
#
# Media: shared hosting has no local exercise dataset (the Docker web container downloads
# ~140 MB at first start), so the build points images/GIFs at the pinned jsDelivr mirror —
# the same mechanism as the mobile and demo builds. Override via WEB_IMG_BASE/WEB_GIF_BASE
# repository variables if you ever host the dataset yourself.
name: Deploy Web (Namecheap)

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-web
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm test
        working-directory: frontend

  deploy:
    needs: test
    if: vars.DEPLOY_WEB == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build (media from CDN)
        working-directory: frontend
        env:
          VITE_IMG_BASE: ${{ vars.WEB_IMG_BASE || 'https://cdn.jsdelivr.net/gh/hasaneyldrm/exercises-dataset@7455efae41b330c265e7cd4b78dfa848e7ce5ebd/images/' }}
          VITE_GIF_BASE: ${{ vars.WEB_GIF_BASE || 'https://cdn.jsdelivr.net/gh/hasaneyldrm/exercises-dataset@7455efae41b330c265e7cd4b78dfa848e7ce5ebd/videos/' }}
        run: |
          npm ci
          npm run build

      # rsync over SSH (Namecheap shared: port 21098). --delete syncs public_html to the
      # build exactly, EXCEPT what the server owns there: cPanel's cgi-bin, AutoSSL's
      # .well-known challenges, and any .htaccess the hosting manages.
      - name: Set up SSH
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          if [ -n "${{ vars.SSH_KNOWN_HOSTS }}" ]; then
            printf '%s\n' "${{ vars.SSH_KNOWN_HOSTS }}" >> ~/.ssh/known_hosts
          else
            ssh-keyscan -p "${{ vars.SSH_PORT || '21098' }}" "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts
          fi

      - name: Deploy via rsync over SSH
        run: |
          rsync -rlptz --delete \
            --exclude='.htaccess' --exclude='.well-known/' --exclude='cgi-bin/' \
            -e "ssh -i ~/.ssh/id_deploy -p ${{ vars.SSH_PORT || '21098' }}" \
            frontend/dist/ "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ vars.WEB_SERVER_DIR || 'public_html/' }}"

      - name: Health check
        if: vars.WEB_URL != ''
        run: |
          for i in $(seq 1 6); do
            if curl -fsS --max-time 10 "${{ vars.WEB_URL }}" | grep -q "<title>FIT"; then
              echo "Site is serving the app."; exit 0
            fi
            echo "not up yet ($i/6)"; sleep 5
          done
          echo "::error::Site did not serve the app after deploy"
          exit 1
