# Runs on pull requests too — the other two workflows only fire on push to main, so
# contributed changes used to reach main without anything ever having been run.
name: Tests

on:
  pull_request:
    paths:
      - 'frontend/**'
      - 'api/**'
      - 'mcp/**'
      - 'web/**'
      - '.github/workflows/test.yml'
  push:
    branches: [main, coach]
    paths:
      - 'frontend/**'
      - 'api/**'
      - 'mcp/**'
      - 'web/**'
      - '.github/workflows/test.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # node:22-alpine in web/Dockerfile and api/Dockerfile — CI must match production.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      # A broken import or bad JSX fails the build long before any test covers it.
      - run: npm run build
        working-directory: frontend
      - run: node scripts/check-locales.mjs
        working-directory: frontend
      # check-locales compares the packs to each other, so a key missing from ALL of them is
      # invisible to it. This walks src/ instead. Report-only for now: there is a known
      # backlog of untranslated demo-view strings to clear before it can fail the build.
      - run: node scripts/check-source-strings.mjs
        working-directory: frontend
      # The fatigue model must never read higher after a rest day than before it.
      # Property probe over ~108k comparisons; too slow for the unit suite, cheap here.
      - run: npm run test:fatigue-probe
        working-directory: frontend

  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Node 22, matching api/Dockerfile and the Namecheap cPanel app. This used to carry a
      # warning that newer Node broke the frontend suite via its localStorage global; that is
      # fixed at the source now (frontend/test/setup.js) and verified by frontend-next-node
      # below, so the pin here is production parity and nothing more.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
        working-directory: api
      # Parse gate for the server itself — the unit suite imports only the pure helpers,
      # so a syntax error in server.js would otherwise ride a green run to a dead deploy.
      - run: node --check server.js
        working-directory: api
      - run: npm test
        working-directory: api
      # ADHERENCE_SEND_DAYS in the api and ADHERENCE_WINDOW_DAYS in the frontend sit either side
      # of a boundary neither can import across. Breaking their relationship does not error --
      # a trimmed date is indistinguishable from a day nobody trained, so every member's
      # adherence just quietly drops.
      - run: node api/scripts/check-adherence-window.mjs
      # Every audit event server.js emits must have a human label in frontend/src/lib/audit.js, or
      # the admin activity log prints a dotted identifier at whoever is reading it. audit.test.js
      # claims to guard this and cannot — its event list is a hand-typed copy, so it only ever
      # tests the names somebody remembered to copy, and three auth.pair.* events had been
      # shipping unlabelled because of it. This reads both files.
      - run: node api/scripts/check-audit-labels.mjs
      # DEFAULT_CHECKIN_DAY lives on both sides of the api/frontend boundary — the member's screen
      # decides which day starts a period, the server decides which day it pushes about one. A
      # drift does not error: the card says a check-in is owed while the push arrives a day later.
      - run: node api/scripts/check-checkin-day.mjs

  # The unit suite imports domain.mjs and nothing else, so until this job existed no HTTP route,
  # cookie check or permission boundary was covered by any automated run: canCoachMember was
  # tested, the /api/coach/member route that depends on it was not. These two suites boot a
  # throwaway server and exercise the routes as a black box, refusals included (401 vs 403,
  # no-enumeration, mixed-batch rejection, the disabled-coach display rules).
  #
  # Its own job rather than steps on `api` above: it runs in parallel so it costs no wall clock,
  # and the checks list names which suite broke. timeout-minutes because this is the only job
  # that backgrounds a long-lived process — a server that hangs should not hold a runner.
  api-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
        working-directory: api
      # Separate steps, not `npm run smoke`, so a failure is attributable at a glance.
      - name: Coach role smoke
        run: npm run smoke:coach
        working-directory: api
      - name: Timetable smoke (29 checks)
        run: npm run smoke:sessions
        working-directory: api

  # The localStorage repair in frontend/test/setup.js is guarded by a feature check, so on the
  # pinned Node 22 above it never executes — leaving the fix for "green in CI, red locally" itself
  # unverified by CI, which is the same split it exists to close. This leg runs the unit suite on a
  # runtime that does expose the global, so a regression in the shim fails a build instead of
  # waiting to ambush whoever next runs the suite on a current Node.
  #
  # Unit suite only: build, locale checks and the fatigue probe are covered on the production
  # version above and have no stake in this.
  frontend-next-node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm test
        working-directory: frontend

  mcp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mcp/package-lock.json
      - run: npm ci
        working-directory: mcp
      - run: npm test
        working-directory: mcp
      # The one check the vitest suite structurally cannot make. The MCP server is a bare node
      # process, but vitest runs its tests through Vite — import.meta.glob, .jsx imports and
      # ?raw all resolve happily there. That is how a Vite-only import reached a shared lib
      # module with 33 green tests standing over a server that died on startup.
      - run: npm run check:node-loadable
        working-directory: mcp

  # Builds *and runs* the images. Building alone would not have caught the api image shipping
  # without a module it imports: that image built perfectly and exited on boot, with CI green.
  # web/nginx.conf.template had no check of any kind. It is rendered by envsubst at container
  # start, so a typo in it is not a build failure -- it is nginx refusing to start, on every
  # self-hoster's `docker compose up`, after a green pipeline. Booting the image is the check:
  # nginx parses its config before it serves anything.
  web-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Context is the repo root, matching docker-publish.yml and docker-compose.yml -- the
      # image builds the frontend in an earlier stage, so web/ alone is not enough.
      - run: docker build -f web/Dockerfile -t opengym-web:test .

      - name: the web image boots, parses its rendered config, and serves the app
        run: |
          docker run -d --name web-test -p 8080:80 opengym-web:test
          for i in $(seq 1 30); do
            curl -fsS http://localhost:8080/ >/dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS http://localhost:8080/ | grep -q '<title'
          # The rendered config, not the template: envsubst runs at start-up, so this is the
          # only place the substituted result is ever parsed.
          docker exec web-test nginx -t
          # node's own limit must be the one that gets hit, because node can answer it in JSON;
          # nginx answers with an HTML error page the client's api() helper cannot parse.
          #
          # This was pinned as the literal `16m`, which caught the change that broke it but for
          # the wrong reason: 16m stopped being correct the moment the API's video cap became
          # 90 MB, and a literal cannot tell "someone lowered nginx" from "someone raised node".
          # So assert the RELATIONSHIP instead — read the rendered value and require it to clear
          # the largest thing the API will accept. A literal here is what let the two drift.
          NGINX_MB=$(docker exec web-test sed -n 's/.*client_max_body_size *\([0-9]*\)m.*/\1/p' /etc/nginx/conf.d/default.conf | head -1)
          API_MB=$(sed -n 's/.*MEDIA_MAX_VIDEO_MB || \([0-9]*\)).*/\1/p' api/server.js | head -1)
          echo "nginx allows ${NGINX_MB}m; the API caps one video at ${API_MB}m"
          # An unsubstituted ${NGINX_MAX_BODY} would fail `nginx -t` above, but an empty capture
          # here would silently make the comparison below vacuous, so say so explicitly.
          test -n "$NGINX_MB" && test -n "$API_MB" || { echo "::error::could not read both limits (nginx='$NGINX_MB' api='$API_MB')"; exit 1; }
          test "$NGINX_MB" -gt "$API_MB" || { echo "::error::nginx ($NGINX_MB m) does not clear the API's video cap ($API_MB m) — nginx becomes the limit and refuses in HTML"; exit 1; }
          # /api/media/ repeats /api/'s proxy_set_header block, and has to: a location that sets
          # any header of its own inherits none of them, so the alternative is hoisting every
          # header to server level and changing what unrelated locations receive. Repetition
          # nobody checks is repetition that drifts — and the drift is silent, because the app
          # keeps working while X-Forwarded-For or CF-Connecting-IP quietly stops being set on
          # uploads, which is what the audit log records. So compare the two blocks.
          # index(), not a /regex/ range: the location prefixes contain slashes, which awk reads
          # as its own regex delimiters. A literal substring match needs no escaping at all.
          hdrs() { docker exec web-test awk -v p="location ^~ $1 {" 'index($0,p),/^    \}/' /etc/nginx/conf.d/default.conf | grep proxy_set_header | sed 's/^ *//' | sort; }
          hdrs '/api/' > /tmp/api-headers
          hdrs '/api/media/' > /tmp/media-headers
          test -s /tmp/api-headers || { echo "::error::found no proxy_set_header lines for /api/ — the block matcher is broken, not the config"; exit 1; }
          diff -u /tmp/api-headers /tmp/media-headers || { echo "::error::the /api/ and /api/media/ proxy_set_header blocks have drifted apart"; exit 1; }
          docker rm -f web-test

  api-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # No --target, exactly like docker-publish.yml: that workflow names no stage, so what it
      # ships is whatever Dockerfile stage happens to be last, and that is the image every
      # self-hoster pulls as :latest. Build it the same way here.
      - run: docker build -t opengym-api:published ./api

      - name: the published image boots and serves
        run: |
          docker run -d --name api-published -e DATA_DIR=/data -p 3000:3000 opengym-api:published
          for i in $(seq 1 30); do
            curl -fsS http://localhost:3000/api/config >/dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS http://localhost:3000/api/config | tee /dev/stderr | grep -q '"invite_only"'
          docker rm -f api-published

      # The AI Coach is gone: no Agent SDK, no Codex CLI, no bubblewrap sandbox, and no second
      # image target that carried them. Asserted rather than assumed — "we deleted the source" and
      # "it is absent from the artifact" are different claims, and only the second one ships.
      - name: no AI runtime survives anywhere in the image
        run: |
          docker run --rm opengym-api:published node -e \
            'import("@anthropic-ai/claude-agent-sdk").then(()=>{console.error("AI runtime present in the published image");process.exit(1)},()=>process.exit(0))'
          ! docker run --rm opengym-api:published codex --version 2>/dev/null
          ! docker run --rm opengym-api:published bwrap --version 2>/dev/null
