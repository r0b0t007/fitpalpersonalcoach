# Runs on pull requests too — the other two workflows only fire on push to main, so
# contributed changes used to reach main without anything ever having been run.
name: Tests

on:
  pull_request:
    paths:
      - 'frontend/**'
      - 'api/**'
      - 'mcp/**'
      - 'scripts/french-vous.mjs'
      - '.github/workflows/test.yml'
  push:
    branches: [main, coach]
    paths:
      - 'frontend/**'
      - 'api/**'
      - 'mcp/**'
      - 'scripts/french-vous.mjs'
      - '.github/workflows/test.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Node 22 — the version the Namecheap cPanel app runs. CI must match production.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      # A broken import or bad JSX fails the build long before any test covers it.
      - run: npm run build
        working-directory: frontend
      - run: node scripts/check-locales.mjs
        working-directory: frontend
      # check-locales compares the packs to each other, so a key missing from ALL of them is
      # invisible to it. This walks src/ instead. Report-only for now: there is a known
      # backlog of untranslated demo-view strings to clear before it can fail the build.
      - run: node scripts/check-source-strings.mjs
        working-directory: frontend
      # The fatigue model must never read higher after a rest day than before it.
      # Property probe over ~108k comparisons; too slow for the unit suite, cheap here.
      - run: npm run test:fatigue-probe
        working-directory: frontend
      # The app speaks French as "vous"; the upstream instruction dataset says "tu". Fails if a
      # rebuild from upstream, or a hand edit, brings a "tu" form back into instr/fr.js.
      - run: node scripts/french-vous.mjs --check

  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Node 22, matching the Namecheap cPanel app this deploys to. This used to carry a
      # warning that newer Node broke the frontend suite via its localStorage global; that is
      # fixed at the source now (frontend/test/setup.js) and verified by frontend-next-node
      # below, so the pin here is production parity and nothing more.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
        working-directory: api
      # Parse gate for the server itself — the unit suite imports only the pure helpers,
      # so a syntax error in server.js would otherwise ride a green run to a dead deploy.
      - run: node --check server.js
        working-directory: api
      - run: npm test
        working-directory: api
      # ADHERENCE_SEND_DAYS in the api and ADHERENCE_WINDOW_DAYS in the frontend sit either side
      # of a boundary neither can import across. Breaking their relationship does not error --
      # a trimmed date is indistinguishable from a day nobody trained, so every member's
      # adherence just quietly drops.
      - run: node api/scripts/check-adherence-window.mjs
      # Every audit event server.js emits must have a human label in frontend/src/lib/audit.js, or
      # the admin activity log prints a dotted identifier at whoever is reading it. audit.test.js
      # claims to guard this and cannot — its event list is a hand-typed copy, so it only ever
      # tests the names somebody remembered to copy, and three auth.pair.* events had been
      # shipping unlabelled because of it. This reads both files.
      - run: node api/scripts/check-audit-labels.mjs
      # DEFAULT_CHECKIN_DAY lives on both sides of the api/frontend boundary — the member's screen
      # decides which day starts a period, the server decides which day it pushes about one. A
      # drift does not error: the card says a check-in is owed while the push arrives a day later.
      - run: node api/scripts/check-checkin-day.mjs
      # The app translates the server's English refusals by their text (frontend/src/lib/
      # server-messages.js). A new message with no pack key does not error; a French coach just
      # reads English at sign-in or when sync fails. This reads every refusal in the api source
      # and checks each one is translated, and that the app's template list matches the api's.
      - run: node api/scripts/check-error-strings.mjs

  # The unit suite imports domain.mjs and nothing else, so until this job existed no HTTP route,
  # cookie check or permission boundary was covered by any automated run: canCoachMember was
  # tested, the /api/coach/member route that depends on it was not. These two suites boot a
  # throwaway server and exercise the routes as a black box, refusals included (401 vs 403,
  # no-enumeration, mixed-batch rejection, the disabled-coach display rules).
  #
  # Its own job rather than steps on `api` above: it runs in parallel so it costs no wall clock,
  # and the checks list names which suite broke. timeout-minutes because this is the only job
  # that backgrounds a long-lived process — a server that hangs should not hold a runner.
  api-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
        working-directory: api
      # Separate steps, not `npm run smoke`, so a failure is attributable at a glance.
      - name: Coach role smoke
        run: npm run smoke:coach
        working-directory: api
      - name: Timetable smoke (29 checks)
        run: npm run smoke:sessions
        working-directory: api

  # The localStorage repair in frontend/test/setup.js is guarded by a feature check, so on the
  # pinned Node 22 above it never executes — leaving the fix for "green in CI, red locally" itself
  # unverified by CI, which is the same split it exists to close. This leg runs the unit suite on a
  # runtime that does expose the global, so a regression in the shim fails a build instead of
  # waiting to ambush whoever next runs the suite on a current Node.
  #
  # Unit suite only: build, locale checks and the fatigue probe are covered on the production
  # version above and have no stake in this.
  frontend-next-node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm test
        working-directory: frontend

  mcp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mcp/package-lock.json
      - run: npm ci
        working-directory: mcp
      - run: npm test
        working-directory: mcp
      # The one check the vitest suite structurally cannot make. The MCP server is a bare node
      # process, but vitest runs its tests through Vite — import.meta.glob, .jsx imports and
      # ?raw all resolve happily there. That is how a Vite-only import reached a shared lib
      # module with 33 green tests standing over a server that died on startup.
      - run: npm run check:node-loadable
        working-directory: mcp
