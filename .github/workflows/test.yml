# Runs on pull requests too — the other two workflows only fire on push to main, so
# contributed changes used to reach main without anything ever having been run.
name: Tests

on:
  pull_request:
    paths:
      - 'frontend/**'
      - 'api/**'
      - 'backend/**'
      - 'mcp/**'
      - 'scripts/french-vous.mjs'
      - '.github/workflows/test.yml'
      - '.github/actions/**'
  push:
    branches: [main, coach]
    paths:
      - 'frontend/**'
      - 'api/**'
      - 'backend/**'
      - 'mcp/**'
      - 'scripts/french-vous.mjs'
      - '.github/workflows/test.yml'
      - '.github/actions/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Node 22 — the version the Namecheap cPanel app runs. CI must match production.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      # A broken import or bad JSX fails the build long before any test covers it.
      - run: npm run build
        working-directory: frontend
      - run: node scripts/check-locales.mjs
        working-directory: frontend
      # check-locales compares the packs to each other, so a key missing from ALL of them is
      # invisible to it. This walks src/ instead. Report-only for now: there is a known
      # backlog of untranslated demo-view strings to clear before it can fail the build.
      - run: node scripts/check-source-strings.mjs
        working-directory: frontend
      # The fatigue model must never read higher after a rest day than before it.
      # Property probe over ~108k comparisons; too slow for the unit suite, cheap here.
      - run: npm run test:fatigue-probe
        working-directory: frontend
      # The app speaks French as "vous"; the upstream instruction dataset says "tu". Fails if a
      # rebuild from upstream or a hand edit brings a "tu" form back into instr/fr.js, or a "tu"
      # pronoun ("ton", "veux-tu", "Crées-en") into locales/fr.js. A bare UI imperative ("Entre
      # un nom") it cannot tell from a preposition or a description — review those by eye.
      - run: node scripts/french-vous.mjs --check

  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Node 22, matching the Namecheap cPanel app this deploys to. This used to carry a
      # warning that newer Node broke the frontend suite via its localStorage global; that is
      # fixed at the source now (frontend/test/setup.js) and verified by frontend-next-node
      # below, so the pin here is production parity and nothing more.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
        working-directory: api
      # Parse gate for the server itself — the unit suite imports only the pure helpers,
      # so a syntax error in server.js would otherwise ride a green run to a dead deploy.
      - run: node --check server.js
        working-directory: api
      - run: npm test
        working-directory: api
      # ADHERENCE_SEND_DAYS in the api and ADHERENCE_WINDOW_DAYS in the frontend sit either side
      # of a boundary neither can import across. Breaking their relationship does not error --
      # a trimmed date is indistinguishable from a day nobody trained, so every member's
      # adherence just quietly drops.
      - run: node api/scripts/check-adherence-window.mjs
      # Every audit event server.js emits must have a human label in frontend/src/lib/audit.js, or
      # the admin activity log prints a dotted identifier at whoever is reading it. audit.test.js
      # claims to guard this and cannot — its event list is a hand-typed copy, so it only ever
      # tests the names somebody remembered to copy, and three auth.pair.* events had been
      # shipping unlabelled because of it. This reads both files.
      - run: node api/scripts/check-audit-labels.mjs
      # DEFAULT_CHECKIN_DAY lives on both sides of the api/frontend boundary — the member's screen
      # decides which day starts a period, the server decides which day it pushes about one. A
      # drift does not error: the card says a check-in is owed while the push arrives a day later.
      - run: node api/scripts/check-checkin-day.mjs
      # The app translates the server's English refusals by their text (frontend/src/lib/
      # server-messages.js). A new message with no pack key does not error; a French coach just
      # reads English at sign-in or when sync fails. This reads every refusal in the api source
      # and checks each one is translated, and that the app's template list matches the api's.
      - run: node api/scripts/check-error-strings.mjs

  # The unit suite imports domain.mjs and nothing else, so until this job existed no HTTP route,
  # cookie check or permission boundary was covered by any automated run: canCoachMember was
  # tested, the /api/coach/member route that depends on it was not. These two suites boot a
  # throwaway server and exercise the routes as a black box, refusals included (401 vs 403,
  # no-enumeration, mixed-batch rejection, the disabled-coach display rules).
  #
  # Its own job rather than steps on `api` above: it runs in parallel so it costs no wall clock,
  # and the checks list names which suite broke. timeout-minutes because this is the only job
  # that backgrounds a long-lived process — a server that hangs should not hold a runner.
  api-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
        working-directory: api
      # Separate steps, not `npm run smoke`, so a failure is attributable at a glance.
      - name: Coach role smoke
        run: npm run smoke:coach
        working-directory: api
      - name: Timetable smoke (29 checks)
        run: npm run smoke:sessions
        working-directory: api

  # The localStorage repair in frontend/test/setup.js is guarded by a feature check, so on the
  # pinned Node 22 above it never executes — leaving the fix for "green in CI, red locally" itself
  # unverified by CI, which is the same split it exists to close. This leg runs the unit suite on a
  # runtime that does expose the global, so a regression in the shim fails a build instead of
  # waiting to ambush whoever next runs the suite on a current Node.
  #
  # Unit suite only: build, locale checks and the fatigue probe are covered on the production
  # version above and have no stake in this.
  frontend-next-node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm test
        working-directory: frontend

  mcp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mcp/package-lock.json
      - run: npm ci
        working-directory: mcp
      - run: npm test
        working-directory: mcp
      # The one check the vitest suite structurally cannot make. The MCP server is a bare node
      # process, but vitest runs its tests through Vite — import.meta.glob, .jsx imports and
      # ?raw all resolve happily there. That is how a Vite-only import reached a shared lib
      # module with 33 green tests standing over a server that died on startup.
      - run: npm run check:node-loadable
        working-directory: mcp

  # The Laravel port (backend/), not yet deployed. PHP 8.4 is the floor (composer.json; Laravel 13,
  # Pest 5 and Symfony 8 all need it) and the cPanel host runs 8.5. Pest runs the feature tests on
  # an in-memory SQLite. pint --test parses every file, so there is no separate syntax step.
  #
  # Then the migrations against the database production runs, which SQLite cannot stand in for:
  # the cPanel MariaDB defaults to MyISAM (1000-byte key limit) and latin1, and failed the first
  # migration in CHW-227 until config/database.php pinned InnoDB. The service is set to MyISAM +
  # latin1 on purpose, so dropping that pin, an index too long for it, or a table left in a
  # non-utf8mb4 charset goes red here instead of during the cutover. One job, so the PHP setup
  # lives in one place.
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: fitpal
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    defaults:
      run:
        # -e fails the step on a failing query (the checks below redirect with `>`, no pipes);
        # pipefail keeps that true if one is ever piped through tee or grep.
        shell: bash -eo pipefail {0}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-backend
      - run: cp .env.example .env && php artisan key:generate --quiet
        working-directory: backend
      - run: ./vendor/bin/pint --test
        working-directory: backend
      - run: ./vendor/bin/pest --ci
        working-directory: backend
        env:
          # Tests that wait out a real lock or timeout (seconds, not minutes) run here; locally
          # they are skipped unless asked for.
          SLOW_TESTS: '1'
      - name: Make the MariaDB service look like the host (MyISAM, latin1)
        run: |
          mysql -h127.0.0.1 -uroot -proot -e "SET GLOBAL default_storage_engine=MyISAM; ALTER DATABASE fitpal CHARACTER SET latin1 COLLATE latin1_swedish_ci;"
          mysql -h127.0.0.1 -uroot -proot -N -e "SELECT @@default_storage_engine, @@version"
      - name: Migrate on MariaDB — up, down, up — and require InnoDB + utf8mb4 everywhere
        working-directory: backend
        env:
          DB_CONNECTION: mariadb
          DB_HOST: 127.0.0.1
          DB_PORT: '3306'
          DB_DATABASE: fitpal
          DB_USERNAME: root
          DB_PASSWORD: root
        run: |
          php artisan migrate --force
          php artisan migrate:rollback --force
          php artisan migrate --force
          mysql -h127.0.0.1 -uroot -proot -N -e "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='fitpal'" > /tmp/n-tables
          mysql -h127.0.0.1 -uroot -proot -N -e "SELECT table_name, engine, table_collation FROM information_schema.tables WHERE table_schema='fitpal' AND (engine <> 'InnoDB' OR table_collation NOT LIKE 'utf8mb4%')" > /tmp/bad-tables
          # Column level too: a ->charset('latin1') on one column keeps a utf8mb4 table default.
          mysql -h127.0.0.1 -uroot -proot -N -e "SELECT table_name, column_name, collation_name FROM information_schema.columns WHERE table_schema='fitpal' AND collation_name IS NOT NULL AND collation_name NOT LIKE 'utf8mb4%'" > /tmp/bad-columns
          echo "tables: $(cat /tmp/n-tables)"; cat /tmp/bad-tables /tmp/bad-columns
          test "$(cat /tmp/n-tables)" -gt 0
          test ! -s /tmp/bad-tables
          test ! -s /tmp/bad-columns
          # Ids and codes compare as JS's === did: binary AND no-pad. utf8mb4_bin is PAD SPACE, so
          # 'CODE ' would still find 'CODE' (a padded revoke hitting the real code). Proven on a
          # real row, not only read from the schema.
          mysql -h127.0.0.1 -uroot -proot -N -e "SELECT table_name, column_name, collation_name FROM information_schema.columns WHERE table_schema='fitpal' AND collation_name IS NOT NULL AND collation_name <> 'utf8mb4_nopad_bin'" > /tmp/padded-columns
          mysql -h127.0.0.1 -uroot -proot -N fitpal -e "INSERT INTO invites (code, created) VALUES ('PADCHECK', 'x'); SELECT (SELECT COUNT(*) FROM invites WHERE code = 'PADCHECK '), (SELECT COUNT(*) FROM invites WHERE code = 'padcheck'); DELETE FROM invites WHERE code = 'PADCHECK';" > /tmp/pad-match
          cat /tmp/padded-columns; echo "padded and lower-cased matches: $(cat /tmp/pad-match)"
          test ! -s /tmp/padded-columns
          test "$(tr -s '[:space:]' ' ' < /tmp/pad-match | xargs)" = "0 0"
      # Every message the backend can send must be a key in every locale pack, or the app shows
      # English to a French or Spanish coach. The PHP side of api/scripts/check-error-strings.mjs.
      - name: Backend error strings are translated
        run: node backend/scripts/check-error-strings.mjs

  # Does the Laravel backend answer like the Node API? Both servers run on the same seeded data
  # (backend/tools/contract/seed.mjs → Node's DATA_DIR as-is, Laravel through
  # `fitpal:import-legacy --verify`), with the same session secret, and every ported route is called on
  # both: status, error strings and envelopes, bodies (exactly, or by shape where values must
  # differ) and the headers the app relies on. Intended differences are listed, with reasons, in
  # the tool; anything else fails the build.
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATA: ${{ github.workspace }}/contract-data
      RP_ID: localhost
      ORIGIN: http://localhost:5173
      INVITE_ONLY: '1'
      ALLOW_GUEST: '0'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json
      - uses: ./.github/actions/setup-backend
      - run: npm ci
        working-directory: api
      - name: Seed one data directory for both servers
        run: node backend/tools/contract/seed.mjs "$DATA"
      - name: Node API on the seed
        run: |
          DATA_DIR="$DATA" PORT=3101 nohup node server.js > /tmp/node.log 2>&1 &
        working-directory: api
      - name: Laravel on the same seed, imported and verified
        working-directory: backend
        run: |
          cp .env.example .env && php artisan key:generate --quiet
          touch database/contract.sqlite
          export DB_CONNECTION=sqlite DB_DATABASE="$PWD/database/contract.sqlite" SESSION_SECRET="$(cat "$DATA/secret")" CACHE_STORE=file APP_DEBUG=false
          php artisan migrate --force
          php artisan fitpal:import-legacy "$DATA" --verify
          # php -S, not artisan serve, so the ini limits the contract needs reach the server. From
          # public/: Laravel's router script loads index.php from the current directory.
          cd public
          nohup php -d post_max_size=100M -d memory_limit=768M -S localhost:3102 \
            ../vendor/laravel/framework/src/Illuminate/Foundation/resources/server.php > /tmp/laravel.log 2>&1 &
      - name: Wait for both
        run: |
          # `|| true`: until a server listens, curl exits 7, and under bash -e that would end the
          # step on the first try instead of retrying.
          for i in $(seq 1 30); do
            a=$(curl -s -o /dev/null -w '%{http_code}' localhost:3101/api/health || true)
            b=$(curl -s -o /dev/null -w '%{http_code}' localhost:3102/api/health || true)
            [ "$a$b" = 200200 ] && exit 0; sleep 1
          done
          echo "node $a laravel $b"; cat /tmp/node.log /tmp/laravel.log; exit 1
      - name: Diff every ported route
        run: node backend/tools/contract/diff.mjs --node http://localhost:3101 --laravel http://localhost:3102 --data "$DATA"
      - name: Server logs
        if: failure()
        run: cat /tmp/node.log /tmp/laravel.log; tail -50 backend/storage/logs/laravel.log || true
