# Deploys the API to Namecheap shared hosting (cPanel "Setup Node.js App" / Passenger)
# over FTPS. See docs/DEPLOY_NAMECHEAP.md for the one-time cPanel and repository setup.
#
# Guardrails, in order:
#   1. The full api test job must pass in THIS run — a deploy never rides an old green.
#   2. The deploy job is opt-in: it only exists while the repository variable DEPLOY_API
#      is 'true', so pushes to main stay green until hosting is actually configured.
#   3. It runs in the `production` environment — add required reviewers there to make
#      every deploy wait for a manual approval.
#   4. One deploy at a time, never cancelled mid-upload (a killed sync = a half-deployed
#      app); a newer push queues behind the running one.
#   5. The sync never uploads or deletes what the server owns: .env, the data dir,
#      the session secret and VAPID keys are excluded, and DATA_DIR should live outside
#      the app root anyway (see docs).
#   6. Post-deploy health check fails the run loudly if /api/health doesn't come back.
name: Deploy API (Namecheap)

on:
  push:
    branches: [main]
    paths:
      - 'api/**'
      - '.github/workflows/deploy-api.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-api
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
        working-directory: api
      - run: node --check server.js
        working-directory: api
      - run: npm test
        working-directory: api

  deploy:
    needs: test
    if: vars.DEPLOY_API == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json

      # Shared hosting can't run npm install for us reliably, so the bundle ships its own
      # production node_modules — all pure-JS deps, built on a Linux runner for a Linux host.
      # tmp/restart.txt changes every deploy, which is Passenger's restart signal.
      - name: Build deploy bundle
        run: |
          cd api
          npm ci --omit=dev
          mkdir -p ../deploy/tmp
          cp -r node_modules server.js domain.mjs package.json package-lock.json ../deploy/
          date -u +'%Y-%m-%dT%H:%M:%SZ' > ../deploy/tmp/restart.txt

      - name: Upload via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: deploy/
          server-dir: ${{ vars.API_SERVER_DIR || 'opengym-api/' }}
          exclude: |
            **/.env
            **/data/**
            **/secret
            **/vapid.json

      - name: Health check
        if: vars.API_HEALTH_URL != ''
        run: |
          for i in $(seq 1 12); do
            if curl -fsS --max-time 10 "${{ vars.API_HEALTH_URL }}" | grep -q '"ok":true'; then
              echo "API healthy."; exit 0
            fi
            echo "not healthy yet ($i/12) — Passenger may still be restarting"; sleep 10
          done
          echo "::error::API did not become healthy after deploy — check the cPanel app log"
          exit 1
