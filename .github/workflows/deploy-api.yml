# Deploys the API to Namecheap shared hosting (cPanel "Setup Node.js App" / Passenger)
# via rsync over SSH (port 21098; enable Shell Access on the hosting first). See docs/DEPLOY_NAMECHEAP.md for the one-time cPanel and repository setup.
#
# Guardrails, in order:
#   1. The full api test job must pass in THIS run — a deploy never rides an old green.
#   2. The deploy job is opt-in: it only exists while the repository variable DEPLOY_API
#      is 'true', so pushes to main stay green until hosting is actually configured.
#   3. It runs in the `production` environment — add required reviewers there to make
#      every deploy wait for a manual approval.
#   4. One deploy at a time, never cancelled mid-upload (a killed sync = a half-deployed
#      app); a newer push queues behind the running one.
#   5. rsync --delete mirrors the bundle exactly but excludes what the server owns:
#      Passenger's .htaccess, .env, data/, secret, vapid.json — and DATA_DIR should
#      live outside the app root anyway (see docs).
#   6. Post-deploy health check fails the run loudly if /api/health doesn't come back.
name: Deploy API (Namecheap)

on:
  push:
    branches: [main]
    paths:
      - 'api/**'
      - '.github/workflows/deploy-api.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-api
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    # The smoke steps below background a server. If one accepts connections but wedges in a
    # handler, a readiness curl waits and the job would sit at the 6-hour default - and because
    # this workflow is `cancel-in-progress: false`, every later push to main queues behind it,
    # so deploys stop entirely. Fail in ten minutes instead. The deploy job below is bounded for
    # the same reason: an rsync that stalls mid-upload blocks the group just as effectively.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
        working-directory: api
      - run: node --check server.js
        working-directory: api
      - run: npm test
        working-directory: api
      # npm test covers the pure helpers in domain.mjs only. These boot the server and exercise
      # the routes themselves, so guardrail #1 above gates on the API actually working rather
      # than on its arithmetic.
      - name: Coach role smoke (61 checks)
        run: npm run smoke:coach
        working-directory: api
      - name: Timetable smoke (29 checks)
        run: npm run smoke:sessions
        working-directory: api

  deploy:
    needs: test
    if: vars.DEPLOY_API == 'true'
    runs-on: ubuntu-latest
    environment: production
    # Bounds the run itself - an ssh/rsync that stalls mid-upload would otherwise hold the
    # deploy-api concurrency group to the 6-hour default and queue every later push behind it.
    # Generous, because a half-finished sync is worse than a slow one: guardrail #4 above is
    # about never cancelling mid-upload, and 30 minutes is far beyond a normal 20-second deploy.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json

      # Shared hosting can't run npm install for us reliably, so the bundle ships its own
      # production node_modules — all pure-JS deps, built on a Linux runner for a Linux host.
      # tmp/restart.txt changes every deploy, which is Passenger's restart signal.
      - name: Build deploy bundle
        run: |
          cd api
          npm ci --omit=dev
          mkdir -p ../deploy/tmp
          cp -r node_modules server.js domain.mjs package.json package-lock.json ../deploy/
          date -u +'%Y-%m-%dT%H:%M:%SZ' > ../deploy/tmp/restart.txt

      # rsync over SSH (Namecheap shared: port 21098, enable Shell Access first).
      # --delete keeps the app root exactly in sync with the bundle, EXCEPT what the
      # server owns: Passenger's .htaccess (deleting it kills the app), any stray .env,
      # and data/ if someone ever pointed DATA_DIR inside the app root against advice.
      - name: Set up SSH
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          if [ -n "${{ vars.SSH_KNOWN_HOSTS }}" ]; then
            printf '%s\n' "${{ vars.SSH_KNOWN_HOSTS }}" >> ~/.ssh/known_hosts
          else
            ssh-keyscan -p "${{ vars.SSH_PORT || '21098' }}" "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts
          fi

      # rsync --delete removes everything at the target that is not in the source. Two repos
      # deploy to this one cPanel account, so a target that resolves to the account home would
      # take the other product's document root, its API and its ./data with it. The obvious
      # wrong values are refused rather than trusted; the failure mode is a red build, not a
      # restore from backup.
      - name: Guard the deploy target
        env:
          TARGET: ${{ vars.API_SERVER_DIR || 'opengym-api/' }}
        run: |
          case "${TARGET%/}" in
            ""|"."|".."|"~"|"/"|'$HOME')
              echo "::error::API_SERVER_DIR='$TARGET' resolves to the account home. rsync --delete there would wipe every other site on this account."
              exit 1 ;;
          esac
          echo "deploy target: $TARGET"

      # -K keeps cPanel's node_modules SYMLINK into the Node venv intact. Without it rsync
      # unlinks the symlink and writes a real directory; Passenger keeps working until the
      # next cPanel Restart or Run-NPM-Install recreates the venv link, and the app then
      # boots against an empty dependency tree.
      #
      # The excludes are anchored with a leading slash. Unanchored, rsync matches them at
      # every depth — so 'data/' and 'secret' would also skip any such path inside the
      # bundled node_modules/, and --delete would protect the stale copy from repair. They
      # are meant to protect the app root only.
      - name: Deploy via rsync over SSH
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ vars.SSH_PORT || '21098' }}
          TARGET: ${{ vars.API_SERVER_DIR || 'opengym-api/' }}
        run: |
          rsync -rlptzK --delete \
            --exclude='/.htaccess' --exclude='/.env' --exclude='/data/' \
            --exclude='/secret' --exclude='/vapid.json' \
            -e "ssh -i ~/.ssh/id_deploy -p $SSH_PORT -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=4" \
            deploy/ "$SSH_USER@$SSH_HOST:$TARGET"

      - name: Health check
        if: vars.API_HEALTH_URL != ''
        run: |
          for i in $(seq 1 12); do
            if curl -fsS --max-time 10 "${{ vars.API_HEALTH_URL }}" | grep -q '"ok":true'; then
              echo "API healthy."; exit 0
            fi
            echo "not healthy yet ($i/12) — Passenger may still be restarting"; sleep 10
          done
          echo "::error::API did not become healthy after deploy — check the cPanel app log"
          exit 1
