# Dependency updates, deliberately quiet.
#
# openGym is dependency-light on purpose: the frontend is React + Router + Zustand, and api/
# has two runtime dependencies. A default Dependabot setup would still open a PR per package
# per week, which on a solo project means the alerts stop being read — the opposite of what
# this is for. So: monthly, everything in an ecosystem grouped into a single PR, and a low
# cap on open PRs. Security advisories are unaffected by any of this; GitHub raises those
# regardless of schedule.
#
# Only manifests that actually exist here are listed. Deliberately NOT covered:
#   - gradle (frontend/android) and cocoapods (frontend/ios) — Capacitor generates those shells
#     and pins the native versions to the @capacitor/* npm packages. Bumping them independently
#     desyncs the two and breaks the mobile build; they follow the npm update instead.
version: 2

updates:
  # Frontend app — frontend/package.json
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      # Routine bumps arrive as one PR. Runtime and build tooling move together anyway (a Vite
      # bump usually wants its plugin bumped), and splitting them doubles the review without
      # splitting the risk.
      frontend:
        patterns: ['*']
        update-types: ['minor', 'patch']
      # Majors get their own PR. The first grouped run bundled a Capacitor 7 → 8 migration in
      # with six siblings, where it read as housekeeping — and CI would have gone green on it,
      # because the test workflow builds the web app and never touches the mobile flavour. A
      # major that lands alone is at least obviously a decision.
      frontend-major:
        patterns: ['*']
        update-types: ['major']
    ignore:
      # `frontend/android` and `frontend/ios` are committed, so a Capacitor major also means
      # migrating the native projects — Gradle/AGP, the Podfile. That is a deliberate piece of
      # work, not a dependency bump. Drop this ignore when you actually want to do it.
      - dependency-name: '@capacitor/*'
        update-types: ['version-update:semver-major']
      # The two plugins below are Capacitor plugins that live in OTHER npm scopes, so the
      # pattern above never matched them — which is how PR #54 happened: it offered
      # @capacitor-mlkit/barcode-scanning 8 and @aparajita/capacitor-secure-storage 8 while
      # @capacitor/core sat at 7, and `npm ci` could not resolve it at all (their peer is
      # `@capacitor/core >=8.0.0`). A plugin major is unmergeable until core moves, by
      # construction, so it is noise rather than a decision.
      #
      # Both are also on their way out rather than up: barcode-scanning is reached only from
      # lib/scan.js via views/CheckIn.jsx, which P6 deletes; secure-storage is reached only
      # from lib/forget-coach.js, kept one release to wipe the credential the AI Coach left in
      # the Keychain/Keystore. When those go, so do these two entries.
      - dependency-name: '@capacitor-mlkit/*'
        update-types: ['version-update:semver-major']
      - dependency-name: '@aparajita/*'
        update-types: ['version-update:semver-major']

  # Backend — api/package.json (@simplewebauthn/server, web-push)
  - package-ecosystem: npm
    directory: /api
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      api:
        patterns: ['*']
        update-types: ['minor', 'patch']
      # Two dependencies, but one of them verifies passkeys — a major there is worth reading on
      # its own rather than alongside anything else.
      api-major:
        patterns: ['*']
        update-types: ['major']

  # Workflow actions — everything under .github/workflows/
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      # These are all first-party actions/* pinned to a major tag; they update in lockstep
      # and none of them is worth a PR of its own.
      actions:
        patterns: ['*']
        update-types: ['minor', 'patch']
      # Action majors are usually a runner or Node-version change and usually harmless — but
      # three of these four workflows rsync into the live cPanel account, so the blast radius
      # is real. Separate PR, so a failure has an obvious cause.
      actions-major:
        patterns: ['*']
        update-types: ['major']
